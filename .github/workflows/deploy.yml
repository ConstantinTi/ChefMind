name: Deploy

# Builds and deploys directly on the server via a self-hosted runner. Nothing
# leaves the machine: no registry, no inbound SSH from GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, chefmind, prod]
    steps:
      - uses: actions/checkout@v4

      # Runs before anything else so a half-set-up server says what is missing,
      # instead of failing three steps later with "docker: command not found".
      - name: Voraussetzungen prüfen
        run: |
          fehler=0

          if ! command -v openssl >/dev/null 2>&1; then
            echo "FEHLER: 'openssl' fehlt — wird für das TLS-Zertifikat gebraucht."
            fehler=1
          fi

          if ! command -v docker >/dev/null 2>&1; then
            echo "FEHLER: 'docker' ist für den Runner-Benutzer ($(whoami)) nicht aufrufbar."
            echo "  PATH: $PATH"
            echo "  Prüfen: ist Docker installiert, und liegt es in diesem PATH?"
            echo "  Bei Rootless- oder Snap-Installationen den Pfad in der Runner-Umgebung ergänzen."
            fehler=1
          elif ! docker info >/dev/null 2>&1; then
            echo "FEHLER: 'docker' ist da, aber der Daemon antwortet nicht für $(whoami)."
            echo "  Meist fehlt die Gruppenmitgliedschaft:"
            echo "    sudo usermod -aG docker $(whoami)"
            echo "  Danach den Runner-Dienst neu starten — eine neue Gruppe greift erst"
            echo "  in einer neuen Sitzung, ein laufender Dienst sieht sie nicht."
            fehler=1
          elif ! docker compose version >/dev/null 2>&1; then
            echo "FEHLER: 'docker compose' fehlt (Compose v2 wird gebraucht, nicht docker-compose)."
            fehler=1
          fi

          # Der Build ist der speicherhungrigste Schritt auf diesem Rechner:
          # Turbopack kompiliert alles in einem Prozess und braucht dafür rund
          # 1,6 GB. Reicht das nicht, killt der Kernel npm mitten im Build, und
          # sichtbar ist davon nur "exit code: 137" — kein Wort über Speicher.
          # Deshalb stehen die Zahlen hier, bevor gebaut wird.
          if command -v free >/dev/null 2>&1; then
            echo "Speicher (MB):"
            free -m
            verfuegbar=$(free -m | awk '/^Mem:/ {print $7}')
            swap=$(free -m | awk '/^Swap:/ {print $2}')
            echo "Verfügbar: ${verfuegbar} MB + ${swap} MB Swap, CPUs: $(nproc)"
            if [ "$((verfuegbar + swap))" -lt 2048 ]; then
              echo "WARNUNG: unter 2 GB nutzbar. Der Build braucht ~1,6 GB —"
              echo "  bricht er mit 'Killed' / exit code 137 ab, war es der"
              echo "  OOM-Killer, kein Fehler im Code. Abhilfe: Swap einrichten,"
              echo "  die laufenden Container vorher stoppen, oder das Image"
              echo "  woanders bauen und hierher pushen."
            fi
          fi

          exit $fehler

      # actions/checkout führt `git clean -ffdx` aus. Das -x entfernt auch
      # ignorierte Dateien — und ./data ist ignoriert. Läge die Datenbank im
      # Workspace, würde jeder Deploy Rezepte, Fotos, Backups und die TLS-CA
      # löschen. Deshalb liegt sie daneben und überlebt jeden Checkout.
      - name: Datenverzeichnis außerhalb des Checkouts
        run: |
          DATA_DIR="$HOME/chefmind-data"
          mkdir -p "$DATA_DIR"
          echo "CHEFMIND_DATA_DIR=$DATA_DIR" >> "$GITHUB_ENV"
          echo "Daten liegen in: $DATA_DIR"

          # Einmalige Übernahme, falls aus einem früheren Deploy noch etwas im
          # Workspace liegt. Nur wenn am Ziel noch nichts steht.
          if [ -f ./data/chefmind.db ] && [ ! -f "$DATA_DIR/chefmind.db" ]; then
            echo "Übernehme vorhandene Daten aus dem Workspace…"
            cp -a ./data/. "$DATA_DIR/"
          fi

          if [ -f "$DATA_DIR/chefmind.db" ]; then
            echo "Vorhandene Datenbank: $(du -h "$DATA_DIR/chefmind.db" | cut -f1)"
          else
            echo "Noch keine Datenbank — wird beim ersten Start angelegt."
          fi

      - name: .env prüfen
        run: |
          if [ ! -f .env ]; then
            if [ -f "$HOME/chefmind.env" ]; then
              # Secrets live on the server, outside the repo, and survive checkout.
              cp "$HOME/chefmind.env" .env
            else
              echo "FEHLER: Keine .env gefunden."
              echo "  Erwartet: $HOME/chefmind.env  (Benutzer: $(whoami))"
              echo "  Vorlage: .env.example aus diesem Repo."
              echo "  Die Datei liegt bewusst außerhalb des Repos: sie enthält den"
              echo "  API-Key und würde von jedem Checkout überschrieben."
              exit 1
            fi
          fi

      # Caddy braucht die Dateien beim Start. Über Tailscale ist das nicht nötig
      # (dort stellt `tailscale serve` ein echtes Zertifikat), für den Zugriff
      # über die LAN-Adresse kann es aber keine öffentliche CA geben.
      - name: TLS-Zertifikat sicherstellen
        run: ./scripts/generate-cert.sh

      - name: Image bauen
        run: docker compose build

      - name: Starten
        run: docker compose up -d --remove-orphans

      - name: Auf Health warten
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' chefmind 2>/dev/null)" = "healthy" ]; then
              echo "ChefMind läuft."
              exit 0
            fi
            sleep 2
          done
          echo "Container wurde nicht healthy. Logs:"
          docker compose logs --tail=50 chefmind
          exit 1

      # Cleanup must never be the error you see. When the job had already failed
      # this step used to run anyway and bury the real cause under exit 127.
      - name: Alte Images aufräumen
        if: success()
        continue-on-error: true
        run: docker image prune -f
