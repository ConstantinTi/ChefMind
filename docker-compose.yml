services:
  chefmind:
    build: .
    image: chefmind:latest
    container_name: chefmind
    restart: unless-stopped
    # Loopback only. Nothing reaches the app except through something that
    # terminates TLS: the caddy service below for the LAN, or `tailscale serve`
    # on the host for the tailnet. Both overwrite x-forwarded-for with the real
    # peer address, which is what makes the private-network check in
    # src/proxy.ts trustworthy rather than merely advisory.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # The SQLite database and every uploaded photo. Back this up; it is all
      # your data, and nothing else in the image is worth keeping.
      - ./data:/data
    env_file:
      - .env
    environment:
      CHEFMIND_DB_PATH: /data/chefmind.db
      CHEFMIND_UPLOAD_DIR: /data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Nightly snapshot of the database, 14 kept. `sqlite3 .backup` is safe on a
  # live database, unlike copying the file while WAL is mid-write.
  # HTTPS für den Zugriff über die LAN-Adresse. Zertifikat vorher erzeugen:
  #   make cert      (bzw. ./scripts/generate-cert.sh)
  # Wer ausschließlich über Tailscale zugreift, braucht diesen Dienst nicht und
  # kann ihn löschen — `tailscale serve` bringt ein echtes Zertifikat mit.
  caddy:
    image: caddy:2-alpine
    container_name: chefmind-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/tls:/tls:ro
    depends_on:
      chefmind:
        condition: service_healthy

  backup:
    image: chefmind:latest
    container_name: chefmind-backup
    restart: unless-stopped
    depends_on:
      # Waiting for healthy guarantees the main container's entrypoint has
      # already chowned /data, so `node` can write here.
      chefmind:
        condition: service_healthy
    # Runs as node, not root: otherwise every snapshot lands root-owned on the
    # host and you need sudo to delete your own backups.
    user: node
    # This service runs a sleep loop, not the web server, so the image's
    # HEALTHCHECK (which probes port 3000) would mark it unhealthy forever.
    healthcheck:
      disable: true
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          mkdir -p /data/backups
          sqlite3 /data/chefmind.db ".backup '/data/backups/chefmind-$$(date +%Y%m%d).db'" \
            && echo "[backup] $$(date -Iseconds) ok" \
            || echo "[backup] $$(date -Iseconds) FEHLGESCHLAGEN"
          ls -1t /data/backups/chefmind-*.db 2>/dev/null | tail -n +15 | xargs -r rm --
        done
