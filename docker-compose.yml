services:
  chefmind:
    build: .
    image: chefmind:latest
    container_name: chefmind
    restart: unless-stopped
    # Published on every interface, so LAN and Tailscale both work without
    # naming their addresses here. The app itself then refuses any request whose
    # client address is not private (src/proxy.ts).
    #
    # Know what that does and does not buy you. The app reads the client address
    # from x-forwarded-for, which Next fills in from the socket but which a
    # client can also send itself. It therefore stops a stray port forward, a
    # scanner, and anything that arrives by accident — not somebody who can
    # already reach the port and forges the header. There is NO login here and
    # /mcp exposes delete_recipe.
    #
    # If this host is reachable from the internet, bind the interfaces instead
    # and delete the line below. That check cannot be forged:
    #   - "192.168.1.20:3000:3000"     # LAN
    #   - "100.101.102.103:3000:3000"  # Tailscale
    ports:
      - "3000:3000"
    volumes:
      # The SQLite database and every uploaded photo. Back this up; it is all
      # your data, and nothing else in the image is worth keeping.
      - ./data:/data
    env_file:
      - .env
    environment:
      CHEFMIND_DB_PATH: /data/chefmind.db
      CHEFMIND_UPLOAD_DIR: /data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s

  # Nightly snapshot of the database, 14 kept. `sqlite3 .backup` is safe on a
  # live database, unlike copying the file while WAL is mid-write.
  backup:
    image: chefmind:latest
    container_name: chefmind-backup
    restart: unless-stopped
    depends_on:
      # Waiting for healthy guarantees the main container's entrypoint has
      # already chowned /data, so `node` can write here.
      chefmind:
        condition: service_healthy
    # Runs as node, not root: otherwise every snapshot lands root-owned on the
    # host and you need sudo to delete your own backups.
    user: node
    # This service runs a sleep loop, not the web server, so the image's
    # HEALTHCHECK (which probes port 3000) would mark it unhealthy forever.
    healthcheck:
      disable: true
    volumes:
      - ./data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          mkdir -p /data/backups
          sqlite3 /data/chefmind.db ".backup '/data/backups/chefmind-$$(date +%Y%m%d).db'" \
            && echo "[backup] $$(date -Iseconds) ok" \
            || echo "[backup] $$(date -Iseconds) FEHLGESCHLAGEN"
          ls -1t /data/backups/chefmind-*.db 2>/dev/null | tail -n +15 | xargs -r rm --
        done
